name: EsthioSotaria
options:
  bundleIdPrefix: dev.tinyvelocet
  deploymentTarget:
    iOS: "17.0"

packages:
  RecallKit:
    path: RecallKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5U7AXJPZ6J
    ENABLE_HARDENED_RUNTIME: YES

targets:
  EsthioSotaria_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - "Resources"
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: RecallKit
      - target: EsthioSotariaWidget_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinyvelocet.esthiosotaria
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: App/EsthioSotaria-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  EsthioSotariaWidget_iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: RecallKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinyvelocet.esthiosotaria.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/EsthioSotariaWidget-iOS.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  # Heads-up render target: compiles the app's own views + RecallKit + MockData
  # to PNG screenshots via SwiftUI ImageRenderer (for design hand-off to Figma).
  # Not shipped — build/run locally (see scripts/ScreenshotGen/Runner.swift).
  EsthioSotaria_ScreenshotGen:
    type: tool
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - "EsthiosotariaApp.swift"
          - "Resources"
          - "Services/BackgroundRefresh.swift"
          - "Services/StoreGeofenceService.swift"
      - path: scripts/ScreenshotGen/Runner.swift
      - path: scripts/ScreenshotGen/StoreGeofenceServiceStub.swift
    dependencies:
      - package: RecallKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinyvelocet.screenshotgen

schemes:
  EsthioSotaria_iOS:
    build:
      targets:
        EsthioSotaria_iOS: all
  EsthioSotaria_ScreenshotGen:
    build:
      targets:
        EsthioSotaria_ScreenshotGen: all